aid: shopline
name: SHOPLINE
description: >-
  SHOPLINE is an all-in-one commerce platform that lets merchants sell across
  online stores, social channels, and offline point-of-sale, serving businesses
  from budding entrepreneurs to global brands across Australia, China, Hong Kong,
  Japan, Malaysia, Singapore, Taiwan, the United Kingdom, and the United States.
  The SHOPLINE Open Platform gives developers a versioned Admin REST API, an
  Admin GraphQL API, and a Storefront API for building apps, themes, and
  integrations. Apps authenticate with OAuth 2.0 (Custom and Public apps) or
  private-app tokens, request granular read_*/write_* access scopes, receive
  HMAC-signed webhooks, and are built with the SHOPLINE CLI against free
  development stores.
